#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2200M -XX:MaxMetaspaceSize=384m -XX:+UseG1GC
kotlin.incremental=true

#Gradle Memory Optimization for 4GB RAM (Gradle minimal 512M, Kotlin compiler gets the rest)
org.gradle.jvmargs=-Xmx512M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=256m -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.vfs.watch=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true


